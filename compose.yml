services:
  db:
    container_name: ${POSTGRES_HOST:-appointment-db}
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appointment}
      POSTGRES_USER: ${POSTGRES_USER:-appointment}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-appointment}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  db-migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: ${POSTGRES_HOST:-appointment-db}
      PGUSER: ${POSTGRES_USER:-appointment}
      PGPASSWORD: ${POSTGRES_PASSWORD:-appointment}
      PGDATABASE: ${POSTGRES_DB:-appointment}
    volumes:
      - ./services/db/migrations:/sql/migrations:ro
      - ./services/db/seed.sql:/sql/seed.sql:ro
      - ./services/db/init.sh:/sql/init.sh:ro
    entrypoint: ["/bin/sh", "/sql/init.sh"]
    restart: "no"

  api:
    image: ${COMPOSE_PROJECT_NAME:-appointment}-api:${IMAGE_TAG:-latest}
    build:
      context: ./services/api
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      DB_URL: postgres://${POSTGRES_USER:-appointment}:${POSTGRES_PASSWORD:-appointment}@${POSTGRES_HOST:-appointment-db}:5432/${POSTGRES_DB:-appointment}?sslmode=disable
      API_VERSION: ${API_VERSION:-0.0.1}
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      ALLOWED_METHODS: ${ALLOWED_METHODS:-GET,POST,PUT,DELETE,OPTIONS}
      ALLOWED_HEADERS: ${ALLOWED_HEADERS:-Content-Type,Authorization}
      TURNSTILE_SECRET: ${TURNSTILE_SECRET:-}
      ENV_NAME: ${ENV_NAME:-development}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      RESEND_FROM_NAME: ${RESEND_FROM_NAME:-Appointment}
    ports:
      - "${API_PORT:-8080}:8080"

  web:
    image: ${COMPOSE_PROJECT_NAME:-appointment}-web:${IMAGE_TAG:-latest}
    build:
      context: ./services/apps/web
      args:
        VITE_API_BASE_URL: /api
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  postgres_data:
